name: rag-eval-baseline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install eval deps
        run: pip install -r requirements-evals.txt
      - name: Run regression eval baseline (gate)
        run: python evals/rag_eval_baseline.py